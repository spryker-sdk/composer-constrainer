namespace: SprykerSdkTest\Zed\ComposerConstrainer
bootstrap: ../../../bootstrap.php
paths:
    tests: .
    data: ../../../_data
    support: _support
    output: ../../../_output
coverage:
    enabled: true
    remote: false
    whitelist:
        include:
            - '../../../../src/*'
suites:
    Communication:
        path: Communication
        actor: ComposerConstrainerCommunicationTester
        modules:
            enabled:
                - Asserts
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Shared\Testify\Helper\LocatorHelper:
                      coreNamespaces:
                          - Spryker
                          - SprykerSdk
                - \SprykerTest\Shared\Transfer\Helper\TransferGenerateHelper:
                      isolated: true
                      schemaDirectories:
                          - src/*/Shared/*/Transfer/
                - \SprykerTest\Shared\Testify\Helper\DependencyHelper
                - \SprykerTest\Zed\Console\Helper\ConsoleHelper
                - \SprykerTest\Zed\Testify\Helper\BusinessHelper
                - \SprykerTest\Shared\Testify\Helper\VirtualFilesystemHelper
    Business:
        path: Business
        actor: ComposerConstrainerBusinessTester
        modules:
            enabled:
                - Asserts
                - \SprykerTest\Shared\Testify\Helper\Environment
                - \SprykerTest\Shared\Testify\Helper\ConfigHelper
                - \SprykerTest\Shared\Testify\Helper\LocatorHelper:
                      coreNamespaces:
                          - Spryker
                          - SprykerSdk
                - \SprykerTest\Shared\Transfer\Helper\TransferGenerateHelper:
                    isolated: true
                - \SprykerTest\Shared\Testify\Helper\DependencyHelper
                - \SprykerTest\Zed\Testify\Helper\BusinessHelper
                - \SprykerTest\Shared\Testify\Helper\VirtualFilesystemHelper
